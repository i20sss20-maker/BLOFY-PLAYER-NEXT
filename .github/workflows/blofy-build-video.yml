name: BLOFY - Build Vertical Promo Video
on:
  push:
    paths:
      - '.github/workflows/blofy-build-video.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: blofy-promo-build
  cancel-in-progress: false
jobs:
  create-video:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install FFmpeg for rendering
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Freeze original marketing images as repository JPEGs
        run: python3 marketing/buffer/build_assets.py
      - name: Render original branded promo
        run: |
          ffmpeg -version | head -n 1
          python3 marketing/buffer/build_video.py
      - name: Commit verified video to public marketing assets
        run: |
          git config user.name "blofy-marketing-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add marketing/videos/*.mp4 marketing/images/tiktok/*.jpg marketing/images/instagram/*.jpg
          if git diff --cached --quiet; then
            echo "Video unchanged."
            exit 0
          fi
          git commit -m "Publish original BLOFY vertical promo video"
          git pull --rebase origin main
          git push origin HEAD:main
