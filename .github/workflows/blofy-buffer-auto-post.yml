name: BLOFY - Free Buffer Auto Publisher
on:
  push:
    paths:
      - '.github/workflows/blofy-buffer-auto-post.yml'
  schedule:
    # Buffer publishes X at 09:30-23:30 Riyadh every 2h; GitHub refills queue every 4h.
    # GitHub schedule may start late; X queue is refilled with unique scheduled posts.
    - cron: '0 6,10,14,18 * * *'
    # Daily read-only audit of actual Buffer publication statuses and errors, 08:20 Saudi time.
    - cron: '20 5 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'check (safe), post-x-now, or scheduled'
        type: choice
        required: true
        default: check
        options:
          - check
          - refill
          - post-x-now
          - post-instagram-now
          - post-tiktok-video-test
          - post-tiktok-test
          - scheduled
permissions:
  contents: read
concurrency:
  group: blofy-buffer-autopublish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate 45-day campaign plan
        run: python3 marketing/buffer/test_campaign.py
      - name: Check Buffer key configured
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: |
          if [ -z "$BUFFER_API_KEY" ]; then
            echo "::error::Set BUFFER_API_KEY in Settings > Secrets and variables > Actions before publishing."
            exit 1
          fi
      - name: Read Buffer channels or create scheduled posts
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          RUN_MODE: ${{ (github.event_name == 'push' || github.event.schedule == '20 5 * * *') && 'check' || (github.event.inputs.mode || 'scheduled') }}
        run: python3 marketing/buffer/publish.py --mode "$RUN_MODE"
